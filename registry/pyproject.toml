[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adp-registry"
version = "1.0.0"
description = "Reference implementation of the A2A Discover Protocol (ADP) Core registry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "a2a-discover contributors" }]
keywords = ["a2a", "agent", "discovery", "registry", "agent-card"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
adp-registry = "adp_registry.__main__:main"

[project.urls]
Homepage = "https://github.com/YY-Yifei/a2a-discover"
Specification = "https://github.com/YY-Yifei/a2a-discover/blob/main/spec/adp-core.md"

[tool.hatch.build.targets.wheel]
packages = ["adp_registry"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"
